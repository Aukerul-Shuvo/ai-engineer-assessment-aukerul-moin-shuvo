[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineer-assessment"
dynamic = ["version"]
description = "FastAPI chatbot that answers from a text corpus and the Superhero API, routing between them with a LangGraph agent and citing every source."
readme = "README.md"
# 3.12 floor: numpy 2.5's type stubs use PEP 695 syntax, so the code cannot be type-checked
# against anything older. Better an explicit install-time error than an unchecked claim.
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Md. Aukerul Moin Shuvo" }]

dependencies = [
  # HTTP service
  "fastapi>=0.141",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.15",
  "orjson>=3.10",
  "sse-starlette>=3.0",
  "slowapi>=0.1.9",
  # Resilience and caching
  "httpx>=0.28",
  "tenacity>=9.1",
  "cachetools>=7.1",
  # Agent orchestration and model providers
  "langgraph>=1.2",
  "langchain>=1.4",
  "langchain-core>=1.6",
  "langchain-google-genai>=4.4",
  "langchain-groq>=1.1",
  "langgraph-checkpoint-sqlite>=3.1",
  # Tools over MCP
  "mcp>=2.1",
  "langchain-mcp-adapters>=0.3",
  # Retrieval
  "bm25s>=0.3",
  "PyStemmer>=2.2",
  "flashrank>=0.2.10",
  "numpy>=2.0",
  # Observability
  "structlog>=26.1",
  "prometheus-fastapi-instrumentator>=8.0",
  "opentelemetry-sdk>=1.44",
  "opentelemetry-exporter-otlp>=1.44",
  "opentelemetry-instrumentation-fastapi",
  "openinference-instrumentation-langchain>=0.1.70",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.0",
  "pytest-cov>=7",
  "respx>=0.23",
  "ruff>=0.16",
  "mypy>=2.0",
]
evals = ["ragas>=0.4"]

[tool.setuptools]
packages = { find = { include = ["app*", "mcp_server*"] } }

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
# D enforces a docstring on every module, class and public function. That is
# deliberate: the code must explain itself to a reader who has not seen it.
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "D", "SIM", "PTH", "RET", "C4", "T20"]
ignore = [
  "D105",   # docstrings on magic methods add noise
  "D107",   # __init__ is documented by its class
  "B008",   # FastAPI's Depends() in defaults is the framework idiom
  "RUF012", # pydantic and FastAPI class attributes are not mutable-default bugs
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app", "mcp_server"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]  # asserts, dummy secrets, no docstring rule in tests
"scripts/**" = ["T20"]                       # CLI scripts may print
"evals/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = [
  "bm25s", "bm25s.*",
  "flashrank", "flashrank.*",
  "Stemmer",
  "cachetools", "cachetools.*",
  "slowapi", "slowapi.*",
  "prometheus_fastapi_instrumentator", "prometheus_fastapi_instrumentator.*",
  "openinference.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = ["live: hits real external services and needs API keys"]
filterwarnings = [
  # Third-party: starlette.testclient still imports a deprecated anyio alias. Not our code.
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "mcp_server"]
branch = true
omit = ["app/llm/embeddings.py"]  # GeminiEmbedder needs a live key; covered by the live eval run

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
